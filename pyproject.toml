[project]
name = "semantic-caching"
version = "0.1.0"
description = "Runnable Redis AI patterns for semantic caching, memory, vector search, RAG, and evaluation."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "AlexJJAX" },
]
keywords = ["redis", "rag", "semantic-cache", "llm", "vector-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "datasets>=4.8.4",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.20",
    "langchain-openai>=1.1.11",
    "langchain-redis>=0.2.0",
    "langchain-text-splitters>=1.1.1",
    "langgraph>=1.1.3",
    "langgraph-checkpoint-redis>=0.4.0",
    "numpy>=2.4.3",
    "openai>=2.29.0",
    "pandas>=3.0.1",
    "pydantic>=2.11.10",
    "pypdf>=6.9.1",
    "python-dotenv>=1.1.1",
    "python-ulid>=3.1.0",
    "ragas>=0.4.3",
    "redis>=7.3.0",
    "redisvl>=0.16.0",
    "rich>=14.3.3",
    "sentence-transformers>=5.3.0",
]

[project.scripts]
portfolio-doctor = "redis_ai_portfolio.doctor:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.14.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
